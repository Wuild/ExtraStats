name: Publish to CurseForge

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip
        shell: bash
        run: |
          set -euo pipefail
          addon_name="$(basename "$GITHUB_WORKSPACE")"
          zip_path="$GITHUB_WORKSPACE/${GITHUB_REF_NAME}.zip"
          cd "$GITHUB_WORKSPACE/.."
          zip -r "$zip_path" "$addon_name" -x "$addon_name/.git/*" "$addon_name/.github/*"

      - name: Publish
        uses: curseforge/wow-addon-action@v1
        with:
          api-token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: "803163"
          file: ${{ github.ref_name }}.zip
